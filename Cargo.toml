[package]
name = "worktrees"
version = "0.1.0"
edition = "2024"
description = "Inspect and switch between Git worktrees"
license = "MIT"
repository = "https://github.com/wyattjoh/worktrees"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
nix = { version = "0.30", features = ["fs", "term"] }
predicates = "3.1"
tempfile = "3.15"

[lints.clippy]
all = "warn"
pedantic = "warn"
