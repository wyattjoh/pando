[package]
name = "worktrees"
version = "0.1.0"
edition = "2024"
description = "Inspect and switch between Git worktrees"
license = "MIT"
repository = "https://github.com/wyattjoh/worktrees"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.5.5"
console = "0.16"
minijinja = "2.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"
sha2 = "0.11"
siphasher = "1.0"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
nix = { version = "0.31", features = ["fs", "term"] }
predicates = "3.1"
tempfile = "3.15"

[lints.clippy]
all = "warn"
pedantic = "warn"
