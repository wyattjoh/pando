[package]
# The bare `pando` crate name is squatted on crates.io, so the package is
# `pando-cli` while the library and binary both keep the plain `pando` name.
name = "pando-cli"
version = "0.2.1"
edition = "2024"
description = "Inspect and switch between Git worktrees"
license = "MIT"
repository = "https://github.com/wyattjoh/pando"
publish = false
rust-version = "1.85"

[lib]
name = "pando"
path = "src/lib.rs"

[[bin]]
name = "pando"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
cliclack = "0.5.6"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
console = "0.16.6"
fs2 = "0.4.3"
minijinja = "2.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
schemars = "1.2.2"
sha2 = "0.11.0"
siphasher = "1.0.4"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
nix = { version = "0.31.3", features = ["fs", "term"] }
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.clippy]
all = "warn"
pedantic = "warn"
